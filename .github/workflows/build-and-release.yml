name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Windows desktop build
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Windows x64, Release)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Windows
          path: |
            build/**/3dGame.exe
          retention-days: 7

  # ------------------------------------------------------------------
  # Linux desktop build
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Linux, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Linux
          path: |
            build/3dGame
          retention-days: 7

  # ------------------------------------------------------------------
  # PSP build (requires the PSPSDK / psp-gcc toolchain)
  # ------------------------------------------------------------------
  build-psp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PSPSDK build dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            build-essential automake bison flex libncurses5-dev \
            libreadline-dev libusb-1.0-0-dev libboost-dev \
            libboost-system-dev libboost-filesystem-dev libgmp-dev \
            libmpfr-dev libssl-dev make patch python3 subversion texinfo \
            wget git liblzma-dev libz-dev

      - name: Build and install PSPSDK toolchain (psp-gcc)
        id: psp-sdk
        env:
          PSPDEV: $HOME/pspdev
        run: |
          set -e
          export PATH="$PSPDEV/bin:$PATH"
          if [ -d "$PSPDEV" ] && [ -x "$PSPDEV/bin/psp-gcc" ]; then
            echo "PSPSDK already present in cache"
            exit 0
          fi
          mkdir -p "$PSPDEV"
          git clone --depth 1 https://github.com/pspdev/psptoolchain.git "$HOME/psptoolchain"
          cd "$HOME/psptoolchain"
          MAKEFLAGS="-j1" ./toolchain.sh

      - name: Configure CMake for PSP
        env:
          PSPDEV: $HOME/pspdev
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake -S . -B build \
            -DBUILD_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PSPDEV/psp/sdk/cmake/PSP.cmake" \
            -DCMAKE_PREFIX_PATH="$PSPDEV/psp/sdk"

      - name: Build PSP port
        env:
          PSPDEV: $HOME/pspdev
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake --build build --config Release --target 3dGame

      - name: Upload PSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-PSP
          path: |
            build/**/EBOOT.PBP
            build/**/3dGame.PBP
          retention-days: 7
