name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Windows desktop build
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Windows x64, Release)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Windows
          path: |
            build/**/3dGame.exe
          retention-days: 7

  # ------------------------------------------------------------------
  # Linux desktop build
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Linux, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Linux
          path: |
            build/3dGame
          retention-days: 7

  # ------------------------------------------------------------------
  # PSP build (requires the PSPSDK / psp-gcc toolchain)
  # ------------------------------------------------------------------
  build-psp:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prebuilt PSPSDK toolchain
        id: download-pspsdk
        run: |
          set -e
          export PSPDEV=$HOME/pspdev
          export PATH=$PSPDEV/bin:$PATH
          mkdir -p $PSPDEV
          
          # Try to download prebuilt toolchain from GitHub releases
          DOWNLOAD_URL=$(wget -qO- https://api.github.com/repos/pspdev/psptoolchain/releases/latest | grep browser_download_url | head -1 | cut -d'"' -f4)
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "Downloading prebuilt PSPSDK from $DOWNLOAD_URL"
            wget -q -O - "$DOWNLOAD_URL" | tar -xj -C $PSPDEV 2>/dev/null || \
            wget -q -O - "$DOWNLOAD_URL" | tar -xz -C $PSPDEV 2>/dev/null || \
            (wget -q "$DOWNLOAD_URL" -O /tmp/psptoolchain.tar && tar -xf /tmp/psptoolchain.tar -C $PSPDEV)
          fi
          
          if [ -x "$PSPDEV/bin/psp-gcc" ]; then
            echo "PSPSDK installed from prebuilt release"
            echo "pspsdk_found=true" >> $GITHUB_OUTPUT
          else
            echo "No prebuilt release found, building from source..."
            echo "pspsdk_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Install PSPSDK build dependencies
        if: steps.download-pspsdk.outputs.pspsdk_found == 'false'
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            build-essential automake bison flex libncurses5-dev \
            libreadline-dev libusb-1.0-0-dev libboost-dev \
            libboost-system-dev libboost-filesystem-dev libgmp-dev \
            libmpfr-dev libssl-dev make patch python3 subversion texinfo \
            wget git liblzma-dev libz-dev

      - name: Build and install PSPSDK toolchain (psp-gcc)
        if: steps.download-pspsdk.outputs.pspsdk_found == 'false'
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          set -ex
          export PATH="${{ env.HOME }}/pspdev/bin:$PATH"
          mkdir -p "${{ env.HOME }}/pspdev"
          git clone --depth 1 https://github.com/pspdev/psptoolchain.git "${{ env.HOME }}/psptoolchain"
          cd "${{ env.HOME }}/psptoolchain"
          ./toolchain.sh 2>&1 | tee /tmp/psp-toolchain.log || (echo "=== PSPTOOLCHAIN BUILD FAILED ===" && tail -100 /tmp/psp-toolchain.log && exit 1)

      - name: Configure CMake for PSP
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          export PATH="${{ env.HOME }}/pspdev/bin:$PATH"
          cmake -S . -B build \
            -DBUILD_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.HOME }}/pspdev/psp/sdk/cmake/PSP.cmake" \
            -DCMAKE_PREFIX_PATH="${{ env.HOME }}/pspdev/psp/sdk"

      - name: Build PSP port
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          export PATH="${{ env.HOME }}/pspdev/bin:$PATH"
          cmake --build build --config Release --target 3dGame

      - name: Upload PSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-PSP
          path: |
            build/**/*.PBP
            build/**/*.pbp
          retention-days: 7

  # ------------------------------------------------------------------
  # Create release and upload all artifacts
  # ------------------------------------------------------------------
  create-release:
    needs: [build-windows, build-linux, build-psp]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine next release tag
        id: tag
        run: |
          set -e
          latest_tag=$(git tag --sort=-v:refname | head -n 1 || echo "0.0.0")
          latest_tag="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_tag"
          : "${major:=0}" "${minor:=0}" "${patch:=0}"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --draft=false \
            --prerelease=false \
            --notes "Auto-built for Windows, Linux, and PSP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows executable to release
        run: |
          WIN_EXE=$(find artifacts/3dGame-Windows -type f -name "*.exe" | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$WIN_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux executable to release
        run: |
          LINUX_EXE=$(find artifacts/3dGame-Linux -type f | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$LINUX_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PSP PBP to release
        run: |
          PSP_PBP=$(find artifacts/3dGame-PSP -type f \( -name "*.PBP" -o -name "*.pbp" \) | head -1)
          if [ -n "$PSP_PBP" ]; then
            gh release upload "${{ steps.tag.outputs.tag }}" "$PSP_PBP" --clobber
          else
            echo "No PSP asset found, skipping PSP upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
