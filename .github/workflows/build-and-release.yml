name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Create a single GitHub release (bumped patch version) that every
  # build job uploads its assets to.
  # ------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release tag
        id: tag
        run: |
          set -e
          # Use latest git tag (not latest release) to avoid conflicts
          latest_tag=$(git tag --sort=-v:refname | head -n 1 || echo "0.0.0")
          latest_tag="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_tag"
          : "${major:=0}" "${minor:=0}" "${patch:=0}"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

          commit_msg=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/  */ /g')
          commit_url="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          {
            echo "You need to have a [map.csv](https://github.com/TNTTheLagger/NagyHazi/blob/master/Extras/map.csv) file next to the exe when running it."
            echo
            echo "Latest commit: [$commit_msg]($commit_url)"
            echo
            echo "Builds:"
            echo "- 3dGame-Windows.exe"
            echo "- 3dGame-Linux"
            echo "- 3dGame-PSP.PBP (EBOOT.PBP)"
          } > release_body.txt
          echo "Created release body for tag $new_tag"

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: ${{ steps.tag.outputs.tag }}
          body_path: release_body.txt
          draft: false
          prerelease: false

  # ------------------------------------------------------------------
  # Windows desktop build
  # ------------------------------------------------------------------
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Windows x64, Release)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Locate Windows executable
        id: find_exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}" -Filter '3dGame.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "No 3dGame.exe found"; exit 1 }
          echo "exe_path=$exe" >> $env:GITHUB_OUTPUT

      - name: Upload Windows executable to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_exe.outputs.exe_path }}
          asset_name: 3dGame-Windows.exe
          asset_content_type: application/octet-stream

  # ------------------------------------------------------------------
  # Linux desktop build
  # ------------------------------------------------------------------
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Linux, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Locate Linux executable
        id: find_exe
        run: |
          exe=$(find "$GITHUB_WORKSPACE" -type f -name '3dGame' | head -n 1)
          if [ -z "$exe" ]; then echo "No 3dGame executable found" >&2; exit 1; fi
          echo "exe_path=$exe" >> $GITHUB_OUTPUT

      - name: Upload Linux executable to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_exe.outputs.exe_path }}
          asset_name: 3dGame-Linux
          asset_content_type: application/octet-stream

  # ------------------------------------------------------------------
  # PSP build (requires the PSPSDK / psp-gcc toolchain)
  # ------------------------------------------------------------------
  build-psp:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PSPSDK build dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            build-essential automake bison flex libncurses5-dev \
            libreadline-dev libusb-1.0-0-dev libboost-dev \
            libboost-system-dev libboost-filesystem-dev libgmp-dev \
            libmpfr-dev libncursesw5 libssl-dev libstdc++6 make patch \
            python3 subversion texinfo wget git liblzma-dev libz-dev

      - name: Build and install PSPSDK toolchain (psp-gcc)
        id: psp-sdk
        run: |
          set -e
          if [ -d "$HOME/pspdev" ] && [ -x "$HOME/pspdev/bin/psp-gcc" ]; then
            echo "PSPSDK already present in cache"
            echo "pspdev_dir=$HOME/pspdev" >> $GITHUB_OUTPUT
            exit 0
          fi
          git clone --depth 1 https://github.com/pspdev/psptoolchain.git "$HOME/psptoolchain"
          cd "$HOME/psptoolchain"
          ./toolchain.sh
          echo "pspdev_dir=$HOME/pspdev" >> $GITHUB_OUTPUT

      - name: Configure CMake for PSP
        env:
          PSPDEV: ${{ steps.psp-sdk.outputs.pspdev_dir }}
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake -S . -B build \
            -DBUILD_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PSPDEV/psp/sdk/cmake/PSP.cmake" \
            -DCMAKE_PREFIX_PATH="$PSPDEV/psp/sdk"

      - name: Build PSP port
        env:
          PSPDEV: ${{ steps.psp-sdk.outputs.pspdev_dir }}
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake --build build --config Release --target 3dGame

      - name: Locate PSP PBP
        id: find_pbp
        run: |
          pbp=$(find "$GITHUB_WORKSPACE/build" -type f \( -name 'EBOOT.PBP' -o -name '3dGame.PBP' \) | head -n 1)
          if [ -z "$pbp" ]; then echo "No PSP PBP found" >&2; exit 1; fi
          echo "pbp_path=$pbp" >> $GITHUB_OUTPUT

      - name: Upload PSP PBP to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_pbp.outputs.pbp_path }}
          asset_name: 3dGame-PSP.PBP
          asset_content_type: application/octet-stream
