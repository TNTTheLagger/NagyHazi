name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Windows desktop build
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Windows x64, Release)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Windows
          path: |
            build/**/3dGame.exe
          retention-days: 7

  # ------------------------------------------------------------------
  # Linux desktop build
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Linux, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Linux
          path: |
            build/3dGame
          retention-days: 7

  # ------------------------------------------------------------------
  # PSP build (prebuilt PSPSDK toolchain from GitHub release assets)
  # ------------------------------------------------------------------
  build-psp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prebuilt PSPSDK toolchain
        env:
          PSPDEV: ${{ github.workspace }}/pspdev
        run: |
          set -e
          export PSPDEV="${{ github.workspace }}/pspdev"
          export PATH="$PSPDEV/bin:$PATH"
          mkdir -p "$PSPDEV"

          echo "Downloading prebuilt PSPSDK toolchain from GitHub releases..."
          curl -sL -o pspdev-linux-x86_64.tar.gz "https://github.com/TNTTheLagger/NagyHazi/releases/download/pspsdk-v1/pspdev-linux-x86_64.tar.gz"

          echo "Extracting PSPSDK toolchain..."
          tar -xzf pspdev-linux-x86_64.tar.gz -C "$PSPDEV" --strip-components=1
          rm -f pspdev-linux-x86_64.tar.gz

          if [ ! -x "$PSPDEV/bin/psp-gcc" ]; then
            echo "ERROR: psp-gcc not found after extraction!"
            exit 1
          fi

          if [ -f "$PSPDEV/psp/sdk/cmake/PSP.cmake" ]; then
            echo "PSP_TOOLCHAIN_FILE=$PSPDEV/psp/sdk/cmake/PSP.cmake" >> "$GITHUB_ENV"
            echo "PSP_PREFIX_PATH=$PSPDEV/psp/sdk" >> "$GITHUB_ENV"
          elif [ -f "$PSPDEV/psp/share/pspdev.cmake" ]; then
            echo "PSP_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake" >> "$GITHUB_ENV"
            echo "PSP_PREFIX_PATH=$PSPDEV/psp" >> "$GITHUB_ENV"
          else
            echo "PSP CMake toolchain files missing from release asset, building PSPSDK from source..."
            sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
              build-essential automake bison flex libncurses5-dev \
              libreadline-dev libusb-1.0-0-dev libboost-dev \
              libboost-system-dev libboost-filesystem-dev libgmp-dev \
              libmpfr-dev libssl-dev libmpc-dev make patch python3 subversion texinfo \
              wget git liblzma-dev libz-dev

            git clone --depth 1 https://github.com/pspdev/psptoolchain.git /tmp/psptoolchain
            (
              cd /tmp/psptoolchain
              ./prepare.sh
              MAKEFLAGS="-j1" ./toolchain.sh
            )

            if [ ! -f "$PSPDEV/psp/sdk/cmake/PSP.cmake" ]; then
              echo "ERROR: PSP.cmake still missing after PSPSDK source build!"
              exit 1
            fi
            echo "PSP_TOOLCHAIN_FILE=$PSPDEV/psp/sdk/cmake/PSP.cmake" >> "$GITHUB_ENV"
            echo "PSP_PREFIX_PATH=$PSPDEV/psp/sdk" >> "$GITHUB_ENV"
          fi
          echo "PSPSDK ready at $PSPDEV"

      - name: Configure CMake for PSP
        env:
          PSPDEV: ${{ github.workspace }}/pspdev
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake -S . -B build \
            -DBUILD_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PSP_TOOLCHAIN_FILE" \
            -DCMAKE_PREFIX_PATH="$PSP_PREFIX_PATH"

      - name: Build PSP port
        env:
          PSPDEV: ${{ github.workspace }}/pspdev
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          cmake --build build --config Release --target 3dGame

      - name: Upload PSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-PSP
          path: |
            build/**/*.PBP
            build/**/*.pbp
          retention-days: 7

  # ------------------------------------------------------------------
  # Create release and upload all artifacts
  # ------------------------------------------------------------------
  create-release:
    needs: [build-windows, build-linux, build-psp]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine next release tag
        id: tag
        run: |
          set -e
          latest_tag=$(git tag --sort=-v:refname | head -n 1 || echo "0.0.0")
          latest_tag="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_tag"
          : "${major:=0}" "${minor:=0}" "${patch:=0}"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --draft=false \
            --prerelease=false \
            --notes "Auto-built for Windows, Linux, and PSP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows executable to release
        run: |
          WIN_EXE=$(find artifacts/3dGame-Windows -type f -name "*.exe" | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$WIN_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux executable to release
        run: |
          LINUX_EXE=$(find artifacts/3dGame-Linux -type f | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$LINUX_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PSP PBP to release
        run: |
          PSP_PBP=$(find artifacts/3dGame-PSP -type f \( -name "*.PBP" -o -name "*.pbp" \) | head -1)
          if [ -n "$PSP_PBP" ]; then
            gh release upload "${{ steps.tag.outputs.tag }}" "$PSP_PBP" --clobber
          else
            echo "No PSP asset found, skipping PSP upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}