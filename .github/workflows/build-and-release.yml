name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Windows desktop build
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Windows x64, Release)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Windows
          path: |
            build/**/3dGame.exe
          retention-days: 7

  # ------------------------------------------------------------------
  # Linux desktop build
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (Linux, Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target 3dGame

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-Linux
          path: |
            build/3dGame
          retention-days: 7

  # ------------------------------------------------------------------
  # PSP build (uses prebuilt PSPSDK from GitHub release assets)
  # ------------------------------------------------------------------
  build-psp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prebuilt PSPSDK toolchain
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          set -e
          export PSPDEV=${{ env.HOME }}/pspdev
          export PATH=$PSPDEV/bin:$PATH
          mkdir -p $PSPDEV

          echo "Downloading prebuilt PSPSDK toolchain from GitHub releases..."
          curl -sL -o pspdev-linux-x86_64.tar.gz "https://github.com/TNTTheLagger/NagyHazi/releases/download/pspsdk-v1/pspdev-linux-x86_64.tar.gz"

          echo "Extracting PSPSDK toolchain..."
          tar -xzf pspdev-linux-x86_64.tar.gz -C $PSPDEV
          rm -f pspdev-linux-x86_64.tar.gz

          if [ ! -x "$PSPDEV/pspdev/bin/psp-gcc" ]; then
            echo "ERROR: psp-gcc not found after extraction!"
            exit 1
          fi
          echo "PSPSDK ready at $PSPDEV/pspdev"

      - name: Configure CMake for PSP
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          export PATH="${{ env.HOME }}/pspdev/pspdev/bin:$PATH"
          cmake -S . -B build \
            -DBUILD_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.HOME }}/pspdev/pspdev/psp/sdk/cmake/PSP.cmake" \
            -DCMAKE_PREFIX_PATH="${{ env.HOME }}/pspdev/pspdev/psp/sdk"

      - name: Build PSP port
        env:
          PSPDEV: ${{ env.HOME }}/pspdev
        run: |
          export PATH="${{ env.HOME }}/pspdev/pspdev/bin:$PATH"
          cmake --build build --config Release --target 3dGame

      - name: Upload PSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dGame-PSP
          path: |
            build/**/*.PBP
            build/**/*.pbp
          retention-days: 7

  # ------------------------------------------------------------------
  # Create release and upload all artifacts
  # ------------------------------------------------------------------
  create-release:
    needs: [build-windows, build-linux, build-psp]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine next release tag
        id: tag
        run: |
          set -e
          latest_tag=$(git tag --sort=-v:refname | head -n 1 || echo "0.0.0")
          latest_tag="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_tag"
          : "${major:=0}" "${minor:=0}" "${patch:=0}"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --draft=false \
            --prerelease=false \
            --notes "Auto-built for Windows, Linux, and PSP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows executable to release
        run: |
          WIN_EXE=$(find artifacts/3dGame-Windows -type f -name "*.exe" | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$WIN_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux executable to release
        run: |
          LINUX_EXE=$(find artifacts/3dGame-Linux -type f | head -1)
          gh release upload "${{ steps.tag.outputs.tag }}" "$LINUX_EXE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PSP PBP to release
        run: |
          PSP_PBP=$(find artifacts/3dGame-PSP -type f \( -name "*.PBP" -o -name "*.pbp" \) | head -1)
          if [ -n "$PSP_PBP" ]; then
            gh release upload "${{ steps.tag.outputs.tag }}" "$PSP_PBP" --clobber
          else
            echo "No PSP asset found, skipping PSP upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}